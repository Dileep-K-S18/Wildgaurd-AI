<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Real-Time Garbage Detection System - Register</title>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;700&family=Roboto:wght@300;400&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: 'Roboto', sans-serif;
      background: linear-gradient(-45deg, #a8e063, #56ab2f, #38ef7d, #11998e);
      background-size: 400% 400%;
      animation: gradientBG 15s ease infinite;
      color: #333;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
    }

    @keyframes gradientBG {
      0% { background-position: 0% 50%; }
      50% { background-position: 100% 50%; }
      100% { background-position: 0% 50%; }
    }

    /* Navbar */
    nav {
      background: rgba(255, 255, 255, 0.95);
      padding: 1.5rem 3rem;
      display: flex;
      justify-content: space-between;
      align-items: center;
      position: sticky;
      top: 0;
      z-index: 1000;
      box-shadow: 0 4px 15px rgba(0, 0, 0, 0.1);
    }

    nav .logo {
      font-family: 'Poppins', sans-serif;
      font-size: 1.8rem;
      font-weight: 700;
      color: #2e7d32;
      display: flex;
      align-items: center;
      gap: 0.5rem;
    }

    nav ul {
      list-style: none;
      display: flex;
      gap: 2rem;
362    }

    nav ul li a {
      text-decoration: none;
      color: #388e3c;
      font-weight: 600;
      position: relative;
      transition: color 0.3s ease;
    }

    nav ul li a:hover {
      color: #1b5e20;
    }

    nav ul li a::after {
      content: '';
      position: absolute;
      width: 0;
      height: 3px;
      background: #1b5e20;
      bottom: -8px;
      left: 0;
      transition: width 0.3s ease;
    }

    nav ul li a:hover::after {
      width: 100%;
    }

    /* Main Content */
    .main-content {
      flex: 1;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 2rem 1rem;
    }

    /* Container */
    .container {
      max-width: 500px;
      width: 100%;
      margin: 0 auto;
      padding: 2.5rem;
      background: white;
      border-radius: 20px;
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.15);
      transition: transform 0.3s ease;
      text-align: center;
    }

    .container:hover {
      transform: translateY(-5px);
    }

    .container h1 {
      color: #2e7d32;
      font-family: 'Poppins', sans-serif;
      font-size: 2rem;
      margin-bottom: 1.5rem;
    }

    form {
      display: flex;
      flex-direction: column;
      gap: 1rem;
      background: rgba(240, 255, 240, 0.8);
      border-radius: 15px;
      padding: 2rem;
      box-shadow: 0 5px 15px rgba(0, 0, 0, 0.05);
      transition: box-shadow 0.3s ease;
    }

    form:hover {
      box-shadow: 0 8px 20px rgba(0, 0, 0, 0.1);
    }

    form input {
      padding: 14px;
      border: 1px solid #81c784;
      border-radius: 10px;
      font-size: 1rem;
      background: #f1f8e9;
      transition: border-color 0.3s ease;
    }

    form input:focus {
      outline: none;
      border-color: #2e7d32;
      box-shadow: 0 0 0 3px rgba(46, 125, 50, 0.1);
    }

    form button {
      padding: 14px;
      background-color: #43a047;
      color: white;
      font-weight: 600;
      font-size: 1rem;
      border: none;
      border-radius: 10px;
      cursor: pointer;
      transition: background-color 0.3s ease, transform 0.2s ease;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 0.5rem;
    }

    form button:hover {
      background-color: #2e7d32;
      transform: translateY(-2px);
    }

    form button:active {
      transform: translateY(0);
    }

    /* Footer */
    footer {
      background: rgba(255, 255, 255, 0.95);
      color: #388e3c;
      text-align: center;
      padding: 1.5rem;
      font-size: 1rem;
      font-weight: 500;
      box-shadow: 0 -4px 15px rgba(0, 0, 0, 0.1);
      width: 100%;
    }

    /* Responsive Design */
    @media screen and (max-width: 768px) {
      nav {
        padding: 1rem 1.5rem;
        flex-direction: column;
        gap: 1rem;
        text-align: center;
      }

      nav ul {
        gap: 1.5rem;
      }

      .container {
        margin: 1rem;
        padding: 2rem 1.5rem;
      }

      .container h1 {
        font-size: 1.8rem;
      }

      body {
        padding-bottom: 4rem;
      }
    }

    @media screen and (max-width: 480px) {
      nav ul {
        flex-direction: column;
        gap: 1rem;
      }

      .container h1 {
        font-size: 1.5rem;
      }

      form {
        padding: 1.5rem;
      }
    }
  </style>
</head>

<body>

  <!-- Navbar -->
  <nav>
    <div class="logo">
      <i class="fas fa-recycle" style="font-size: 2rem; color: #2e7d32;"></i>
      Real-Time Garbage Detection System
    </div>
    <ul>
      <li><a href="#"><i class="fas fa-home"></i> Home</a></li>
      <li><a href="#"><i class="fas fa-info-circle"></i> About</a></li>
      <li><a href="#"><i class="fas fa-book"></i> Docs</a></li>
      <li><a href="#"><i class="fas fa-question-circle"></i> Help</a></li>
    </ul>
  </nav>

  <!-- Main Content -->
  <div class="main-content">
    <div class="container">
      <h1><i class="fas fa-user-plus"></i> Register for Users</h1>

      <form action="{{ url_for('register') }}" method="post">
        <input type="text" name="user_id" placeholder="👤 Choose User ID" required />
        <input type="password" name="password" placeholder="🔒 Choose Password" required />
        <button type="submit">
          <i class="fas fa-user-plus"></i> Register Now
        </button>
      </form>
    </div>
  </div>

  <!-- Footer -->
  <footer>
    <div style="margin-bottom: 0.5rem;">
      <i class="fas fa-heart" style="color: #e91e63;"></i>
      &copy; 2025 — Real-Time Garbage Detection System using Deep Learning and AI
    </div>
    <div>Powered by Advanced Computer Vision & Machine Learning</div>
  </footer>

</body>
</html>
