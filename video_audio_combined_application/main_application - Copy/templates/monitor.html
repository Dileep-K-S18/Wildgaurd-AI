<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <title>Live Monitor</title>
  <style>
    body { font-family: Arial, sans-serif; text-align:center; padding:20px; }
    video, img { max-width: 100%; }
    .controls { margin-top: 12px; }
    button { padding: 10px 16px; margin: 6px; font-size:16px; cursor:pointer; }
    .flash { color: green; }
  </style>
</head>
<body>
  <h2>Live Camera Monitor</h2>
  {% with messages = get_flashed_messages(with_categories=true) %}
    {% if messages %}
      <ul>
      {% for category, msg in messages %}
        <li class="flash">{{ msg }}</li>
      {% endfor %}
      </ul>
    {% endif %}
  {% endwith %}

  <div>
    <!-- MJPEG stream -->
    <img id="video_stream" src="{{ url_for('video_feed') }}" alt="Live stream" />
  </div>

  <div class="controls">
    <form style="display:inline" action="{{ url_for('start_monitor') }}" method="post">
      <button type="submit">Start Monitoring</button>
    </form>
    <form style="display:inline" action="{{ url_for('stop_monitor') }}" method="post">
      <button type="submit">Stop Monitoring</button>
    </form>
    <a href="{{ url_for('download_csv') }}"><button>Download CSV</button></a>
    <a href="{{ url_for('home') }}"><button>Back Home</button></a>
  </div>

  <p>Note: Only person, animals and vehicles (COCO classes) are detected and logged.</p>
</body>
</html>
